name: Release

on:
  push:
    tags:
      - 'v[0-9]*'   # v1.0.0
      - '[0-9]*'    # 1.0.0
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза (например 1.0.0 или v1.0.0)'
        required: true

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # При ручном запуске собираем именно указанный тег, а не master.
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: version
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # publish, а не build: для библиотечного проекта только он кладёт рядом
      # зависимости из NuGet (ImGui.NET, 0Harmony) и папку runtimes/.
      - name: Publish
        run: |
          dotnet publish Despada/Despada.csproj -c Release -o publish \
            -p:Version=${{ steps.version.outputs.version }} \
            -p:ContinuousIntegrationBuild=true

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp publish/Despada.dll publish/ImGui.NET.dll publish/0Harmony.dll dist/
          (cd publish && zip -r "$GITHUB_WORKSPACE/dist/Despada-${{ steps.version.outputs.version }}.zip" .)
          (cd dist && sha256sum Despada.dll ImGui.NET.dll 0Harmony.dll \
            "Despada-${{ steps.version.outputs.version }}.zip" > SHA256SUMS.txt)
          ls -la dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            dist/Despada.dll \
            dist/ImGui.NET.dll \
            dist/0Harmony.dll \
            "dist/Despada-${{ steps.version.outputs.version }}.zip" \
            dist/SHA256SUMS.txt \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes \
            --verify-tag
