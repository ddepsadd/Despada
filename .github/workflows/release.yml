name: Release

on:
  push:
    tags:
      - 'v[0-9]*'   # v1.0.0
      - '[0-9]*'    # 1.0.0
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза (например 1.0.0 или v1.0.0)'
        required: true

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # При ручном запуске собираем именно указанный тег, а не master.
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: version
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # publish, а не build: для библиотечного проекта только он кладёт рядом
      # зависимости из NuGet (ImGui.NET, 0Harmony) и папку runtimes/.
      - name: Publish
        run: |
          dotnet publish Despada/Despada.csproj -c Release -o publish \
            -p:Version=${{ steps.version.outputs.version }} \
            -p:ContinuousIntegrationBuild=true

      # Бинарей в релизе два: сам патч и ImGui.NET.
      # Нативный cimgui вшит в Despada.dll как EmbeddedResource (NativeLoader),
      # 0Harmony приходит от лаунчера — дублировать их не нужно.
      # Рядом едут лицензии, notices и указатель на Corresponding Source.
      - name: Package
        shell: bash
        run: |
          mkdir -p dist/licenses
          cp publish/Despada.dll publish/ImGui.NET.dll dist/
          cp LICENSE.md THIRD-PARTY-NOTICES.md dist/
          cp licenses/OFL-1.1.txt licenses/MIT.txt dist/licenses/

          sha="$(git rev-parse HEAD)"
          {
            echo "Despada ${{ steps.version.outputs.tag }}"
            echo "Copyright (C) 2026 ddepsadd"
            echo
            echo "Licensed under the GNU Affero General Public License v3.0 or later."
            echo "See LICENSE.md. Third-party components: THIRD-PARTY-NOTICES.md."
            echo
            echo "Corresponding Source for these binaries (AGPL-3.0 section 6d)"
            echo "is available from the same place, at the exact commit they were"
            echo "built from:"
            echo
            echo "  https://github.com/ddepsadd/Despada/tree/${sha}"
            echo "  commit: ${sha}"
          } > dist/SOURCE.txt

          (cd dist && sha256sum Despada.dll ImGui.NET.dll LICENSE.md \
            THIRD-PARTY-NOTICES.md SOURCE.txt \
            licenses/OFL-1.1.txt licenses/MIT.txt > SHA256SUMS.txt)
          ls -laR dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            dist/Despada.dll \
            dist/ImGui.NET.dll \
            dist/LICENSE.md \
            dist/THIRD-PARTY-NOTICES.md \
            dist/SOURCE.txt \
            dist/licenses/OFL-1.1.txt \
            dist/licenses/MIT.txt \
            dist/SHA256SUMS.txt \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes \
            --verify-tag