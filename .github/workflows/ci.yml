name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Despada.slnx

      - name: Build
        run: dotnet build Despada.slnx -c Release --no-restore

      - name: Test
        shell: bash
        run: |
          # Тестовых проектов пока нет — шаг сам себя пропустит, когда они появятся.
          mapfile -t projects < <(find . -name '*.[Tt]ests.csproj' -o -name '*[Tt]est.csproj')
          if [ ${#projects[@]} -eq 0 ]; then
            echo "::notice::Тестовые проекты не найдены, шаг пропущен."
            exit 0
          fi
          for p in "${projects[@]}"; do
            echo "::group::dotnet test $p"
            dotnet test "$p" -c Release --logger 'trx;LogFileName=results.trx' --results-directory TestResults
            echo "::endgroup::"
          done

      - name: Upload test results
        if: always() && hashFiles('TestResults/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: Despada-${{ github.sha }}
          path: Despada/bin/Release/net10.0/
          if-no-files-found: error
